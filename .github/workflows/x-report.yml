name: X daily analytics report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
  push:
    branches:
      - main
    paths:
      - 'data/x-report-test.trigger'

permissions:
  contents: write

jobs:
  report-x:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build X daily analytics report
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: node scripts/x-report.mjs

      - name: Save analytics and report
        run: |
          git config user.name "affiliate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/x-analytics.json reports/x-daily
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
          else
            git commit -m "Add daily X analytics report"
            git push
          fi
