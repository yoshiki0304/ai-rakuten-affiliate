name: Daily affiliate update

on:
  workflow_dispatch:
  # Scheduled operation paused to preserve X API credits.
  # To resume, uncomment the schedule and cron lines below.
  # schedule:
  #   - cron: '15 18 * * *'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build affiliate site
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: npm run build-site

      - name: Commit generated site
        run: |
          git config user.name "affiliate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/products.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update affiliate products"
            git push
          fi
