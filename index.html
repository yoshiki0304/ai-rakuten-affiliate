<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>楽天API 接続テスト</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f7f7f8}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 56px}
    h1{font-size:28px;margin:0 0 8px}.lead{margin:0 0 24px;color:#555}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px 14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
    button{margin-top:16px;border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;background:#bf0000;color:#fff;cursor:pointer}button:disabled{opacity:.5}.status{margin:14px 0 0;font-size:14px;white-space:pre-wrap}.ok{color:#087f23}.ng{color:#b00020}
    .products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover}.body{padding:12px}.name{font-weight:700;font-size:14px;line-height:1.45}.price{font-size:18px;font-weight:800;margin-top:8px}.meta{font-size:12px;color:#666;margin-top:6px}.buy{display:block;text-decoration:none;text-align:center;margin-top:10px;padding:10px;border-radius:9px;background:#bf0000;color:#fff;font-weight:700;font-size:14px}
    .note{font-size:12px;color:#666;margin-top:14px;line-height:1.6}footer{margin-top:34px;font-size:12px;color:#666;text-align:center}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>楽天市場API 接続テスト</h1>
  <p class="lead">GitHub Pages から楽天市場APIへ接続できるか確認します。入力したキーはこのページ内でのみ使用し、GitHubには保存しません。</p>
  <section class="panel">
    <div class="grid">
      <div><label>Application ID</label><input id="appId" autocomplete="off"></div>
      <div><label>Access Key</label><input id="accessKey" type="password" autocomplete="off"></div>
      <div><label>Affiliate ID</label><input id="affiliateId" autocomplete="off"></div>
      <div><label>検索キーワード</label><input id="keyword" value="一人暮らし 便利グッズ"></div>
    </div>
    <button id="run">楽天APIへ接続</button>
    <div id="status" class="status"></div>
    <p class="note">接続エラー時は、HTTPステータスや楽天APIのエラー内容をここに表示します。</p>
  </section>
  <section id="products" class="products"></section>
  <footer>Supported by Rakuten Web Service</footer>
</main>
<script>
const run=document.getElementById('run'),statusEl=document.getElementById('status'),products=document.getElementById('products');
function status(t,ok=false){statusEl.textContent=t;statusEl.className='status '+(ok?'ok':'ng')}
function render(items){products.innerHTML='';items.slice(0,8).forEach(item=>{const image=item.mediumImageUrls?.[0]?.imageUrl||item.mediumImageUrls?.[0]||'';const url=item.affiliateUrl||item.itemUrl||'#';const card=document.createElement('article');card.className='card';card.innerHTML=`${image?`<img src="${image}" alt="">`:''}<div class="body"><div class="name"></div><div class="price">¥${Number(item.itemPrice||0).toLocaleString('ja-JP')}</div><div class="meta">${item.reviewAverage?`★ ${item.reviewAverage} / ${item.reviewCount||0}件`:'レビュー情報なし'}</div><a class="buy" href="${url}" target="_blank" rel="nofollow sponsored noopener">楽天市場で見る</a></div>`;card.querySelector('.name').textContent=item.itemName||'商品名なし';products.appendChild(card)})}
run.addEventListener('click',async()=>{const applicationId=document.getElementById('appId').value.trim(),accessKey=document.getElementById('accessKey').value.trim(),affiliateId=document.getElementById('affiliateId').value.trim(),keyword=document.getElementById('keyword').value.trim();if(!applicationId||!accessKey||!keyword){status('Application ID、Access Key、検索キーワードを入力してください。');return}run.disabled=true;products.innerHTML='';statusEl.className='status';statusEl.textContent='接続中…';const p=new URLSearchParams({applicationId,accessKey,keyword,format:'json',formatVersion:'2',hits:'8',sort:'-reviewCount',imageFlag:'1'});if(affiliateId)p.set('affiliateId',affiliateId);const url='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?'+p.toString();try{const r=await fetch(url,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',referrer:location.href,referrerPolicy:'strict-origin-when-cross-origin'});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=null}if(!r.ok){status(`HTTP ${r.status}\n${data?.error||''}\n${data?.error_description||text.slice(0,500)}`);return}const items=data?.Items||data?.items||[];const normalized=items.map(x=>x.Item||x.item||x).filter(Boolean);if(!normalized.length){status('HTTP 200 ですが商品が0件でした。\n'+text.slice(0,500));return}render(normalized);status(`接続成功：${normalized.length}件取得しました。`,true)}catch(e){status('ブラウザ通信エラー\n'+e.message+'\n\nAllowed websites が yoshiki0304.github.io になっているか確認してください。')}finally{run.disabled=false}});
</script>
</body>
</html>
